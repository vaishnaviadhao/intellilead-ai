services:
  postgres:
    image: postgres:16-alpine
    container_name: intellilead-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellilead
      POSTGRES_USER: intellilead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellilead_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - intellilead_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellilead -d intellilead"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  intellilead_pgdata:
